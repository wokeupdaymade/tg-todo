services:
  bot:
    build: .
    env_file: .env
    environment:
      DB_PATH: /data/todo.sqlite
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Terminates HTTPS with an automatic Let's Encrypt certificate for $DOMAIN.
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [bot]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
